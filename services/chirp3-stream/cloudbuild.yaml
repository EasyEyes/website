steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/chirp3-stream/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chirp3-stream:$BUILD_ID
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/chirp3-stream:$BUILD_ID
substitutions:
  _REGION: us-central1
  _REPOSITORY: speech
