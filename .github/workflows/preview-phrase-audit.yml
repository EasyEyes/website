name: Isolated preview phrase usage audit
on:
  push:
    branches: [feat/compiler-phrase-audit]
    paths:
      - scripts/phrases-audit/preview.py
      - .github/workflows/preview-phrase-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: website
          submodules: recursive
      - uses: actions/checkout@v6
        with:
          repository: EasyEyes/remote-calibrator
          ref: 6321e71747c8edf2f074760d95cf48c87d59d77f
          path: remote-calibrator
      - uses: actions/checkout@v6
        with:
          repository: EasyEyes/speaker-calibration
          ref: dc432c5af4dcf4f7710aab3b21d671db6bad10a2
          path: speaker-calibration
      - uses: github/codeql-action/setup-codeql@v4
        id: codeql
      - name: Audit checked-out commits without publishing shared state
        run: python3 website/scripts/phrases-audit/preview.py
        env:
          CODEQL_BIN: ${{ steps.codeql.outputs.codeql-path }}
      - uses: actions/upload-artifact@v6
        with:
          name: preview-phrase-audit
          path: website/scripts/phrases-audit/preview-report.json
          if-no-files-found: error
