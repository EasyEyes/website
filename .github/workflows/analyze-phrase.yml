name: Catalog usage audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "scripts/catalog-audit/**"
      - "netlify/functions/glossary/**"
      - "netlify/functions/phrases/**"
      - "docs/experiment/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:catalog-audit
      - run: npm run catalog-audit -- --output=catalog-usage-index.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: catalog-usage-index
          path: catalog-usage-index.json
          if-no-files-found: error
