name: International phrases audit

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Sheet creates this ID automatically. Manual run? Create a queued Firestore run first; see scripts/phrases-audit/README.md.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: international-phrases-audit
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out website and compiler repositories
        id: checkout
        uses: actions/checkout@v6
        with:
          path: website
          submodules: recursive
      - uses: actions/checkout@v6
        with:
          repository: EasyEyes/remote-calibrator
          path: remote-calibrator
      - uses: actions/checkout@v6
        with:
          repository: EasyEyes/speaker-calibration
          path: speaker-calibration
      - name: Set up CodeQL CLI
        id: codeql
        uses: github/codeql-action/setup-codeql@v4
      - name: Check audit report logic
        run: python3 -m unittest discover -s website/scripts/phrases-audit -p 'test_*.py'
      - name: Check missing-sheet CodeQL query
        run: |
          PYTHONPATH=website/scripts/phrases-audit python3 -c 'from missing_sheet import write_sheet_keys; write_sheet_keys(["EE_LanguageCode"])'
          "$CODEQL_BIN" pack install website/scripts/phrases-audit
          "$CODEQL_BIN" query compile --check-only website/scripts/phrases-audit/missing-sheet-keys.ql
        env:
          CODEQL_BIN: ${{ steps.codeql.outputs.codeql-path }}
      - name: Probe phrases endpoints from GitHub runner
        shell: bash
        run: |
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          for host in easyeyes.app easyeyes.netlify.app; do
            for route in phrases audit; do
              if [[ "$route" == phrases ]]; then
                url="https://$host/.netlify/functions/phrases?versionOnly=1"
                method=GET
              else
                url="https://$host/.netlify/functions/phrases-audit?action=result"
                method=POST
              fi
              : > "$headers"
              status=$(curl -sS --max-time 20 -X "$method" -D "$headers" -o /dev/null -w '%{http_code}' "$url") || status="transport-error"
              echo "probe host=$host route=$route method=$method status=$status"
              awk -F: '{ key=tolower($1); if (key=="server" || key=="cf-ray" || key=="cf-mitigated" || key=="x-nf-request-id" || key=="x-audit-diagnostic-id" || key=="content-type") print }' "$headers"
            done
          done
      - name: Run phrase audit
        id: audit
        run: python3 website/scripts/phrases-audit/audit.py
        env:
          CODEQL_BIN: ${{ steps.codeql.outputs.codeql-path }}
          CATALOG_USAGE_REPORT_URL: ${{ secrets.CATALOG_USAGE_REPORT_URL }}
          CATALOG_USAGE_REPORT_SECRET: ${{ secrets.CATALOG_USAGE_REPORT_SECRET }}
      - name: Upload report for workflow debugging
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: international-phrases-report-${{ inputs.run_id }}
          path: website/scripts/phrases-audit/all-reports.json
          if-no-files-found: ignore
      - name: Save audit result in Firestore
        if: always() && steps.checkout.outcome == 'success'
        run: python3 website/scripts/phrases-audit/publish.py "$AUDIT_RUN_ID"
        env:
          AUDIT_RUN_ID: ${{ inputs.run_id }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          CATALOG_USAGE_REPORT_URL: ${{ secrets.CATALOG_USAGE_REPORT_URL }}
          CATALOG_USAGE_REPORT_SECRET: ${{ secrets.CATALOG_USAGE_REPORT_SECRET }}
