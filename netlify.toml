[build]
environment = { NODE_VERSION = "18.17.0", NPM_VERSION = "9.6.7" }
publish = "docs/"
command = "npm run netlify"

[[plugins]]
package = "@netlify/plugin-functions-install-core"

[[headers]]
for = "/hdr/*"
[headers.values]
Cross-Origin-Embedder-Policy = "require-corp"
Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
for = "/compiler/threshold/*"
[headers.values]
Cross-Origin-Embedder-Policy = "require-corp"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
for = "/compiler/"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/compiler/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/compiler/deployment.json"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/compiler/dist/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Media is consumed by remote-calibrator, speaker-calibration, and threshold,
# which run under Cross-Origin-Embedder-Policy: require-corp. A raw Google
# download URL cannot carry the matching Cross-Origin-Resource-Policy header,
# so media is served through this origin instead.
[[headers]]
for = "/media/*"
[headers.values]
Cross-Origin-Resource-Policy = "cross-origin"
Access-Control-Allow-Origin = "*"
Cache-Control = "public, max-age=31536000, immutable"
Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
# Define which paths this specific [[headers]] block will cover.
for = "/*"
[headers.values]
Access-Control-Allow-Origin = "*"

# Serve media from the bucket under this origin, so the headers above apply and
# so the backing bucket can change without breaking links already pasted into
# international phrases.
[[redirects]]
from = "/media/*"
to = "https://storage.googleapis.com/easyeyes-media.firebasestorage.app/:splat"
status = 200
force = true

# Rewrite /home to /home.html (keeps URL as /home)
[[redirects]]
from = "/home"
to = "/home.html"
status = 200
force = true

# Redirect /experiment/* to /compiler/* (canonical route)
[[redirects]]
from = "/experiment/*"
to = "/compiler/:splat"
status = 301
force = true

# Rewrite /compiler/* to /experiment/* (serves content, keeps URL as /compiler/)
[[redirects]]
from = "/compiler/*"
to = "/experiment/:splat"
status = 200
force = true

# [[plugins]]
# package = "@netlify/plugin-lighthouse"

[dev]
command = "npm start"
port = 8888
targetPort= 5500
publish = "docs/"

[functions]
node_bundler = "esbuild"
